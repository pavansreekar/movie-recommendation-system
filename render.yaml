# Render Blueprint — deploys the Flask backend as a web service.
# Frontend is deployed separately on Vercel (see README).
#
# Usage: connect your GitHub repo on https://dashboard.render.com → New → Blueprint
services:
  - type: web
    name: nextpick-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    # One process x 8 threads. The free instance has 0.1 CPU and 512 MB, so a second process
    # adds no CPU, doubles memory and startup work, and keeps its own copy of every cache.
    # The app mostly waits on TMDB, Groq and the database, which threads handle well.
    startCommand: gunicorn web_app:app --workers 1 --threads 8 --worker-class gthread --bind 0.0.0.0:$PORT --timeout 120
    # No healthCheckPath: Render's check gives up after 5 seconds, and on the free instance a
    # busy moment (e.g. just after boot) is enough to miss it, so Render restarted a working
    # server and lost its caches. Requests that do hang are bounded by timeouts in the app.
    # No `plan` here on purpose: Render keeps whatever instance type the service has, so it is
    # changed in the dashboard and a Blueprint sync never switches a paid instance back to free.
    envVars:
      - key: TMDB_API_KEY
        sync: false           # fill in Render dashboard — never commit secrets
      - key: GROQ_API_KEY
        sync: false           # optional — enables the chat assistant; free key at console.groq.com
      - key: FLASK_SECRET_KEY
        generateValue: true   # Render auto-generates a strong random value
      - key: DATABASE_URL
        sync: false           # PostgreSQL connection string — get a free DB at neon.tech
      - key: FRONTEND_ORIGINS
        sync: false           # set to your Vercel URL after frontend is deployed
      - key: TMDB_TIMEOUT_SECONDS
        value: "8"
      - key: TMDB_MAX_RETRIES
        value: "3"
